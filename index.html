<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mischief</title>
<meta name="description" content="Mischief: a gaming community. Pick a game, see what is new, and see who is online and playing.">
<link rel="icon" type="image/svg+xml" href="assets/mischief-m-flat.svg">
<link rel="preload" href="assets/fonts/cinzel-latin.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app boot" id="app">

  <!-- left rail: logo, home, all games, then one button per game -->
  <nav class="rail" id="rail" aria-label="Games"></nav>

  <!-- centre: wordmark, tabs, headline, update pill and news cards -->
  <main class="stage" id="stage">
    <div class="home" id="home"></div>
    <div class="hero" id="hero" aria-hidden="true"></div>
    <header class="topbar">
      <div class="wordmark" id="wordmark"></div>
      <div class="tabs" id="tabs" role="tablist"></div>
    </header>
    <section class="copy" id="copy"></section>
    <div class="launch" id="launch"></div>
    <div class="news">
      <button class="vtoggle" id="vtoggle" type="button" aria-label="Toggle background video"></button>
      <div class="cards" id="cards"></div>
    </div>
  </main>

  <!-- right: log in, then who is online and what they are playing -->
  <aside class="social" id="social" aria-label="Members"></aside>
  <button class="reopen" id="reopen" type="button" aria-label="Open members panel"></button>
</div>
<audio id="bgm" loop preload="auto"></audio>
<script src="app.js"></script>
</body>
</html>
